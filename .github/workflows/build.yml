name: Build Torrent Player

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Download MPV Portable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Invoke-WebRequest -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/2024-02-18/mpv-x86_64-v3-20240218-git-53e34b9.7z" -OutFile mpv.7z
          7z x mpv.7z -obin -y
          Remove-Item mpv.7z

      - name: Install dependencies
        run: npm ci

      - name: Build & Publish Executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
